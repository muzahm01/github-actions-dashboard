services:
  # PostgreSQL with pgvector extension
  postgres:
    image: pgvector/pgvector:pg16
    container_name: gha-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gha}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gha_secret}
      POSTGRES_DB: ${POSTGRES_DB:-github_actions}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gha} -d ${POSTGRES_DB:-github_actions}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - gha-network

  # Redis for caching and Celery broker
  redis:
    image: redis:7-alpine
    container_name: gha-redis
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - gha-network

  # FastAPI application
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: gha-api
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - DEBUG=${DEBUG:-true}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - POSTGRES_USER=${POSTGRES_USER:-gha}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-gha_secret}
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB:-github_actions}
      - REDIS_URL=redis://redis:6379/0
      - GITHUB_TOKEN=${GITHUB_TOKEN}
      - GITHUB_WEBHOOK_SECRET=${GITHUB_WEBHOOK_SECRET}
      - GITHUB_ORG=${GITHUB_ORG}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - SECRET_KEY=${SECRET_KEY:-change-me-in-production}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend/app:/app/app
      - ./backend/migrations:/app/migrations
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - gha-network

  # Celery worker for background tasks
  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: gha-celery-worker
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - POSTGRES_USER=${POSTGRES_USER:-gha}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-gha_secret}
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB:-github_actions}
      - REDIS_URL=redis://redis:6379/0
      - GITHUB_TOKEN=${GITHUB_TOKEN}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend/app:/app/app
    command: celery -A app.tasks.celery_app worker --loglevel=info --concurrency=4
    networks:
      - gha-network

  # Celery beat for scheduled tasks
  celery-beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: gha-celery-beat
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - POSTGRES_USER=${POSTGRES_USER:-gha}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-gha_secret}
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB:-github_actions}
      - REDIS_URL=redis://redis:6379/0
      - GITHUB_TOKEN=${GITHUB_TOKEN}
    depends_on:
      - celery-worker
    volumes:
      - ./backend/app:/app/app
    command: celery -A app.tasks.celery_app beat --loglevel=info
    networks:
      - gha-network

  # Prometheus for metrics collection
  prometheus:
    image: prom/prometheus:latest
    container_name: gha-prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - gha-network
    depends_on:
      - api

  # Grafana for metrics visualization
  grafana:
    image: grafana/grafana:latest
    container_name: gha-grafana
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources:ro
    networks:
      - gha-network
    depends_on:
      - prometheus

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local

networks:
  gha-network:
    driver: bridge

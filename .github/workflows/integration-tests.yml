name: Integration Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    # Run integration tests every 4 hours (self-monitoring)
    - cron: '0 */4 * * *'

jobs:
  integration-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Create .env file
        run: |
          cat > .env << EOF
          ENVIRONMENT=testing
          DEBUG=false
          POSTGRES_USER=gha
          POSTGRES_PASSWORD=gha_secret
          POSTGRES_DB=github_actions
          GITHUB_TOKEN=${{ secrets.TEST_GITHUB_TOKEN || 'test-token' }}
          GITHUB_WEBHOOK_SECRET=test-secret
          GITHUB_ORG=test-org
          ANTHROPIC_API_KEY=${{ secrets.ANTHROPIC_API_KEY || 'test-key' }}
          OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY || 'test-key' }}
          SECRET_KEY=test-secret-key
          EOF

      - name: Start services
        run: docker-compose up -d

      - name: Wait for services
        run: |
          timeout 120 bash -c 'until curl -f http://localhost:8000/health; do sleep 2; done'

      - name: Run migrations
        run: docker-compose exec -T api uv run alembic upgrade head

      - name: Install test dependencies
        working-directory: ./backend
        run: uv sync

      - name: Run integration tests
        working-directory: ./backend
        env:
          ENVIRONMENT: testing
          POSTGRES_USER: gha
          POSTGRES_PASSWORD: gha_secret
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_DB: github_actions
          REDIS_URL: redis://localhost:6379/0
        run: uv run pytest tests/integration -v

      - name: Check service health
        run: |
          curl -f http://localhost:8000/health/ready
          curl -f http://localhost:8000/metrics

      - name: Show logs on failure
        if: failure()
        run: docker-compose logs

      - name: Cleanup
        if: always()
        run: docker-compose down -v

  # Report self-monitoring results (when scheduled)
  report-health:
    runs-on: ubuntu-latest
    needs: integration-test
    if: github.event_name == 'schedule'
    steps:
      - name: Report test results
        run: |
          echo "Integration tests completed on schedule"
          echo "Status: ${{ needs.integration-test.result }}"
          # In production, this would send results back to the dashboard via webhook

      - name: Create issue on failure
        if: needs.integration-test.result == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '🚨 Scheduled Integration Tests Failed',
              body: 'The scheduled integration tests have failed. Please investigate.\n\nWorkflow: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}',
              labels: ['bug', 'automated', 'monitoring']
            })

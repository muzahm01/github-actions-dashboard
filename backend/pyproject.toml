[project]
name = "github-actions-dashboard"
version = "0.1.0"
description = "Monitor and analyze GitHub Actions workflows with LLM integration"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic==1.14.0",
    "anthropic==0.40.0",
    "asyncpg==0.30.0",
    "celery==5.4.0",
    "fastapi==0.115.6",
    "httpx==0.28.1",
    "openai==1.58.1",
    "pgvector==0.3.6",
    "prometheus-client==0.21.1",
    "pydantic==2.10.4",
    "pydantic-settings==2.7.0",
    "python-json-logger==2.0.7",
    "redis==5.2.1",
    "sentry-sdk[fastapi]==2.19.2",
    "sqlalchemy==2.0.36",
    "uvicorn[standard]==0.34.0",
]

[dependency-groups]
dev = [
    "bandit==1.8.0",
    "factory-boy==3.3.1",
    "faker==33.1.0",
    "freezegun==1.4.0",
    "hypothesis==6.122.3",
    "mypy==1.14.1",
    "pre-commit==4.0.1",
    "pytest==8.3.4",
    "pytest-asyncio==0.25.0",
    "pytest-cov==6.0.0",
    "pytest-mock==3.14.0",
    "pytest-xdist==3.5.0",
    "respx==0.22.0",
    "ruff==0.8.4",
    "testcontainers==4.8.2",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]
ignore = ["E501", "N818"]  # Allow Exception suffix naming flexibility

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "unit: Unit tests (fast, isolated)",
    "integration: Integration tests (with database)",
    "e2e: End-to-end tests (full stack)",
    "slow: Slow tests (skip in quick runs)",
    "llm: Tests requiring LLM API",
]
addopts = "--strict-markers -ra --tb=short"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["app"]
branch = true
omit = [
    "app/infrastructure/database/models/*",
    "app/infrastructure/database/session.py",
    "app/tasks/*",
]

[tool.coverage.report]
fail_under = 85
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "class.*Protocol.*:",
    "@abstractmethod",
]

[project]
name = "github-actions-dashboard"
version = "0.1.0"
description = "Monitor and analyze GitHub Actions workflows with LLM integration"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic==1.14.0",
    "anthropic==0.77.0",
    "async-timeout>=5.0.1",
    "asyncpg==0.31.0",
    "celery==5.6.2",
    "fastapi==0.115.6",
    "httpx==0.28.1",
    "openai==1.58.1",
    "pgvector==0.3.6",
    "prometheus-client==0.24.1",
    "psycopg2-binary>=2.9.11",
    "pydantic==2.10.4",
    "pydantic-settings==2.7.0",
    "python-json-logger==2.0.7",
    "python-socketio>=5.16.0",
    "redis[asyncio]==5.2.1",
    "sentry-sdk[fastapi]==2.19.2",
    "sqlalchemy==2.0.36",
    "uvicorn[standard]==0.40.0",
    "websockets>=16.0",
]

[dependency-groups]
dev = [
    "bandit==1.9.3",
    "factory-boy==3.3.1",
    "faker==40.1.2",
    "freezegun==1.4.0",
    "hypothesis==6.151.2",
    "mypy==1.14.1",
    "pre-commit==4.0.1",
    "pytest==9.0.2",
    "pytest-asyncio==0.25.0",
    "pytest-cov==6.0.0",
    "pytest-mock==3.14.0",
    "pytest-xdist==3.5.0",
    "respx==0.22.0",
    "ruff==0.8.4",
    "testcontainers==4.14.1",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]
ignore = ["E501", "N818", "B008"]  # B008: Allow FastAPI Query() defaults

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "unit: Unit tests (fast, isolated)",
    "integration: Integration tests (with database)",
    "e2e: End-to-end tests (full stack)",
    "slow: Slow tests (skip in quick runs)",
    "llm: Tests requiring LLM API",
]
addopts = "--strict-markers -ra --tb=short"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["app"]
branch = true
omit = [
    "app/infrastructure/database/models/*",
    "app/infrastructure/database/session.py",
    "app/infrastructure/database/repositories/base.py",
    "app/infrastructure/external/*",
    "app/tasks/*",
    "app/main.py",
    "app/core/logging.py",
    "app/api/v1/websocket.py",  # WebSocket protocol handler - requires WebSocket client for testing
    # New feature modules - tests to be added in future iteration
    "app/api/v1/notifications.py",
    "app/api/v1/trends.py",
    "app/api/v1/prompts.py",
    "app/api/v1/self_monitoring.py",
    "app/application/services/notification_service.py",
    "app/application/services/prompt_service.py",
    "app/application/services/github_sync_service.py",
    "app/application/services/error_analyzer.py",
    "app/application/services/embedding_service.py",
    "app/application/services/search_service.py",
    "app/domain/*",  # Domain layer - protocol definitions and data classes
]

[tool.coverage.report]
fail_under = 85
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "class.*Protocol.*:",
    "@abstractmethod",
]
